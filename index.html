          "name": "Onde fazer uma limpeza detalhada ao meu carro/mota?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Na Renew Garage, localizada na Zona Empresarial de Tavira (Lote 117), no Algarve. Dispomos de um espaço seguro e ambiente controlado, equipado com produtos e ferramentas de topo para serviços especializados de detalhe automóvel e lavagens detalhadas tanto para carros como para motas."
          }
        },
        {
          "@type": "Question",
          "name": "Qual a diferença entre car detailing e uma lavagem simples?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Uma lavagem simples/convencional apenas remove a sujidade visível e recorre frequentemente a métodos rápidos que criam riscos na pintura. O car detailing é um tratamento técnico minucioso: utiliza lavagens em várias fases (com pré-lavagem e método dos dois baldes), descontaminação de pintura, limpeza e higienização detalhada de estofos e plásticos com proteção UV, e aplicação de selantes ou cerâmicas para proteger o veículo a longo prazo."
          }
        },
        {
          "@type": "Question",
          "name": "O polimento remove riscos?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim, o polimento técnico elimina riscos, marcas circulares (swirls) e imperfeições que afetam a camada de verniz, restaurando a cor e o brilho originais da pintura (com remoção de até 50% no Polimento Basic e até 90% no Polimento Premium). Danos muito profundos que tenham chegado à chapa ou tinta requerem repintura, mas o polimento minimiza drasticamente a sua visibilidade."
          }
        },
        {
          "@type": "Question",
          "name": "Quanto custa um detailing na RenewGarage?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "O valor depende do tipo de viatura, tamanho e do nível de tratamento pretendido. As lavagens detalhadas começam nos 49€ (carros) e 35€ (motas), as higienizações de interior a partir de 145€ e os serviços de polimento a partir de 220€. Também dispomos de planos de manutenção mensal desde 45€ e elaboramos orçamentos à medida após avaliação do seu veículo."
          }
        },
        {
          "@type": "Question",
          "name": "Também fazem mecânica simples na Renew?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Sim! Para além dos serviços de detalhe e estética automóvel, realizamos intervenções de mecânica rápida e preventiva, incluindo mudanças de óleo e filtros, substituição de pastilhas e discos de travão, troca e diagnóstico de baterias, e revisões gerais para garantir a máxima segurança da sua viatura."
          }
        }
      ]
